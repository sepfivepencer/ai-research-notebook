name: Check research notebook

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python tools/check_notebook.py check
      - run: python tools/check_notebook.py reading-list > /tmp/reading-list.md
      - run: diff -u notes/reading-list.md /tmp/reading-list.md
      - run: python tools/audit_experiment.py
      - run: python -m unittest discover -s tests -v
